<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кэшбэк — октябрь 2026</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<meta name="theme-color" content="#12161d">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f3f5;--card:#fff;--ink:#16181d;--mute:#8b9099;--line:#e6e8ec;
  --on:#e8f9e0;--onb:#3ec13e;--accent:#111;--shop:#fff4e6;--shopb:#f59e0b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1114;--card:#181b20;--ink:#eef0f3;--mute:#8b9099;--line:#282c33;
        --on:#14361a;--onb:#3ec13e;--accent:#eef0f3;--shop:#2e2410;--shopb:#f59e0b}
}
:root[data-theme="dark"]{--bg:#0f1114;--card:#181b20;--ink:#eef0f3;--mute:#8b9099;--line:#282c33;--on:#14361a;--onb:#3ec13e;--accent:#eef0f3;--shop:#2e2410;--shopb:#f59e0b}
:root[data-theme="light"]{--bg:#f2f3f5;--card:#fff;--ink:#16181d;--mute:#8b9099;--line:#e6e8ec;--on:#e8f9e0;--onb:#3ec13e;--accent:#111;--shop:#fff4e6;--shopb:#f59e0b}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:0 0 50px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:50;background:var(--bg);padding:13px 0 0;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:800;letter-spacing:-.4px}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--mute);
  border:none;background:none;border-bottom:2.5px solid transparent;font-family:inherit}
.tab.act{color:var(--accent);border-bottom-color:var(--accent)}
.pane{display:none;padding-top:16px}
.pane.act{display:block}

.pct{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.p-hi{color:#1a9938}.p-mid{color:#e07b00}.p-lo{color:var(--mute)}
@media (prefers-color-scheme:dark){.p-hi{color:#5bd75b}.p-mid{color:#f0a838}}
.note{font-size:10.5px;color:var(--mute);margin-top:1px;line-height:1.3}
.auto-tag{font-size:8.5px;background:#ddd6fe;color:#5b21b6;padding:1px 4px;border-radius:3px;
  margin-left:4px;font-weight:700;vertical-align:1px}
@media (prefers-color-scheme:dark){.auto-tag{background:#3b2a6b;color:#c4b5fd}}
.s-tag{font-size:8.5px;background:var(--line);color:var(--mute);padding:1px 4px;border-radius:3px;
  margin-left:4px;font-weight:700;vertical-align:1px}
.search{width:100%;padding:11px 14px;font-size:15px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;margin-bottom:13px}
.search:focus{outline:none;border-color:var(--onb)}

/* ---- вкладка 1: сетка по банкам ---- */
.grid-scroll{overflow-x:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));column-gap:8px;row-gap:0;min-width:1100px}
.bhead{padding:8px 11px;border-radius:8px 8px 0 0;font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.6px}
.blimit{font-size:9.5px;font-weight:500;opacity:.75;text-transform:none;letter-spacing:0}
/* шапка над каждым человеком: банк слева, цифры его карт справа — так же легко, как лимит */
.bhead{display:flex;flex-direction:column;gap:1px}
.bh1,.bh2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.bnums{font-size:10px;font-weight:600;opacity:.8;text-transform:none;letter-spacing:.2px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.bh2 .bnums{font-size:9.5px;font-weight:500;opacity:.75}
.rowlabel{grid-column:1/-1;font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:1.1px;color:var(--mute);margin:16px 0 6px;padding-left:2px}
.rowlabel:first-child{margin-top:0}
.cell{background:var(--card);border-radius:0 0 8px 8px;padding:7px;min-height:52px}
.ci{display:flex;gap:7px;align-items:baseline;padding:5px 6px;border-radius:5px;
  margin-bottom:2px;font-size:12.5px;background:var(--on);font-weight:600}
.ci .pct{flex:0 0 auto;min-width:34px;font-size:12px}
.ci.hide{display:none}
.season-row{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 15px;margin-top:12px}
.season-row .st{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--mute);margin-bottom:9px}
.srow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.sgroup{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sw{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  color:var(--mute);white-space:nowrap}
@media(max-width:640px){.sgroup{width:100%}.sw{width:100%}}
.sgrid{display:flex;flex-wrap:wrap;gap:7px}
.sitem{background:var(--on);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:6px}
.sitem .pct{font-size:12.5px}

/* ---- вкладка 2: категории колонками ---- */
.cols{column-count:3;column-gap:11px}
@media(max-width:1000px){.cols{column-count:2}}
@media(max-width:640px){.cols{column-count:1}}
.gcard{background:var(--card);border-radius:12px;padding:12px 13px 9px;margin:0 0 11px;
  break-inside:avoid;-webkit-column-break-inside:avoid}
.gt{font-size:13px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.sub{margin-bottom:10px}
.sub-t{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;
  color:var(--mute);margin-bottom:4px}
/* фиксированные колонки: % | название | М/Г | банк */
.row{display:grid;grid-template-columns:54px 1fr 32px 44px;align-items:baseline;
  gap:7px;padding:3px 2px;font-size:12.5px}
.row .pct{white-space:nowrap}
.who-pair{display:flex;gap:2px;justify-content:flex-end}
.who-pair .who{padding:1px 3px}
.row .pct{font-size:12.5px}
.row .nm{min-width:0}
.row .bk{font-size:9.5px;color:var(--mute);text-align:right;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.who{font-size:8.5px;font-weight:800;padding:1px 4px;border-radius:3px;text-align:center;
  justify-self:end;min-width:15px}
.w-m{background:#fce7f3;color:#a81b60}
.w-g{background:#dbeafe;color:#1e5eb8}
.w-b{background:var(--line);color:var(--mute)}
@media (prefers-color-scheme:dark){.w-m{background:#4a1733;color:#f9a8d4}.w-g{background:#16325c;color:#93c5fd}}
.gcard.hide,.sub.hide,.row.hide{display:none}
.legend{font-size:11px;color:var(--mute);margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap}
.legend b{color:var(--ink)}
.empty{text-align:center;padding:26px;color:var(--mute);font-size:13px}

/* ---- вкладка 3: карты плашками ---- */
.ksec{margin-bottom:18px}
.ksec h2{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.1px;color:var(--mute);margin-bottom:7px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border-radius:9px;padding:9px 11px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tn{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.tile .tnum{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:.3px;line-height:1.3}
.tile .tnum small{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:10px;
  font-weight:600;opacity:.75;margin-left:4px;letter-spacing:0}
</style>
</head>

  return v>5?'p-hi':(v===5?'p-mid':'p-lo'); };
const esc = s => String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const rank = b => { const i=DATA.order.indexOf(b); return i<0?99:i; };
// порядок столбцов на вкладках «По банкам» и «Карты» — как на доске: Т-Банк первым.
// Приоритет при равном % (DATA.order, Яндекс первым) от него не зависит.
const VIEW = ["tinkoff","yandex","alfa","vtb","ozon","sber"];
const BANKS = VIEW.map(id=>bankById(id));
// цифры карт из CARDS: "8370 / 9415 вирт." → [{d:"8370"},{d:"9415",tag:"вирт."}]
const cardsOf = (bank,who) => { const s=(CARDS[bank]||{})[who]; return !s ? [] :
  s.split('/').map(x=>x.trim()).map(x=>{ const m=x.match(/^(\d{4})\s*(.*)$/); return m?{d:m[1],tag:m[2]}:{d:x,tag:''}; }); };
const extrasOf = (bank,who) => ((CARDS[bank]||{}).extra||[]).filter(e=>e.who===who);
const numsText = list => list.map(c=>c.d+(c.tag?' '+c.tag:'')).join(' / ');
// сортировка: сначала % по убыванию, при равенстве — приоритет банка
const sortItems = a => a.slice().sort((x,y)=> y.p-x.p || rank(x.bank)-rank(y.bank));
// одна и та же категория в одном банке с одним % у обоих — схлопываем в строку с меткой «МГ»
const mergeBoth = list => {
  const out=[], seen=new Map();
  for(const it of list){
    const k=[it.n,it.bank,it.p,it.label||'',it.note||'',it.season?1:0].join('|');
    if(seen.has(k)){ seen.get(k).who='both'; continue; }
    const copy={...it}; seen.set(k,copy); out.push(copy);
  }
  return out;
};

/* ---------- вкладка 1 ---------- */
function buildGrid(){
  const row = who => BANKS.map(b=>{
    const list=(DATA.cats[b.id][who]||[]).slice().sort((x,y)=>y.p-x.p);
    return `<div class="cell">`+list.map(c=>`<div class="ci" data-n="${esc(c.n.toLowerCase())}">
      <span class="pct ${cls(c.p,c)}">${fmt(c)}</span>
      <span>${esc(c.n)}${c.auto?'<span class="auto-tag">авто</span>':''}
      ${c.note?`<div class="note">${esc(c.note)}</div>`:''}</span></div>`).join('')+`</div>`;
  }).join('');
  const heads = who => BANKS.map(b=>{
    const ex = extrasOf(b.id,who);
    return `<div class="bhead" style="background:${b.color};color:${b.text}">
      <div class="bh1"><span>${b.name}</span><span class="bnums">${esc(numsText(cardsOf(b.id,who)))}</span></div>
      <div class="bh2"><span class="blimit">${b.limit}</span>${ex.length?`<span class="bnums">AA ${esc(ex.map(e=>e.digits).join(' / '))}</span>`:''}</div>
    </div>`; }).join('');
  const sgroup = (label, list) => !list.length ? '' : `<div class="sgroup">
    <div class="sw">${label}</div>
    <div class="sgrid">${list.map(s=>
      `<div class="sitem"><span class="pct ${cls(s.p)}">${fmt(s)}</span>${esc(s.n)}</div>`).join('')}</div>
  </div>`;
  const season = sgroup('Оба', DATA.seasonal.filter(s=>s.who==='both'))
               + sgroup('Только Маша', DATA.seasonal.filter(s=>s.who==='masha'))
               + sgroup('Только Глеб', DATA.seasonal.filter(s=>s.who==='gleb'));
  document.getElementById('p1').innerHTML=`
    <input class="search" id="gs" placeholder="Поиск по категориям">
    <div class="grid-scroll"><div class="grid">
      <div class="rowlabel">Глеб</div>${heads('gleb')}${row('gleb')}
      <div class="rowlabel">Маша</div>${heads('masha')}${row('masha')}
    </div></div>
    ${DATA.seasonal.length?`<div class="season-row">
      <div class="st">Яндекс · сезонные за Свои Плюсы · не суммируются с категориями</div>
      <div class="srow">${season}</div>
    </div>`:''}`;
  document.getElementById('gs').oninput = e=>{
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#p1 .ci').forEach(el=>
      el.classList.toggle('hide', q && !el.dataset.n.includes(q)));
  };
}

/* ---------- вкладка 2 ---------- */
function buildCats(){
  const card = g=>{
    // в группе магазинов подгруппы с ≤2 строками сливаем в общее «Прочее»
    let gsubs = g.subs;
    if(g.shops){
      const keep = g.subs.filter(s=>s.items.length>2);
      const rest = g.subs.filter(s=>s.items.length<=2).flatMap(s=>s.items);
      gsubs = rest.length ? [...keep, {t:"Прочее", items:sortItems(rest)}] : keep;
    }
    const subs = gsubs.map(s=>{
      const items = mergeBoth(sortItems(s.items));
      return `<div class="sub" data-t="${esc(s.t.toLowerCase())}">
        ${s.t?`<div class="sub-t">${esc(s.t)}</div>`:''}
        ${items.map(it=>{
          const b=bankById(it.bank);
          return `<div class="row" data-n="${esc((it.n+' '+s.t).toLowerCase())}">
            <span class="pct ${cls(it.p,it)}">${fmt(it)}</span>
            <span class="nm">${esc(it.n)}${it.season?'<span class="s-tag">сезон</span>':''}${it.auto?'<span class="auto-tag">авто</span>':''}
              ${it.note?`<div class="note">${esc(it.note)}</div>`:''}</span>
            ${it.who==='both'
              ? '<span class="who-pair"><span class="who w-m">М</span><span class="who w-g">Г</span></span>'
              : `<span class="who ${it.who==='masha'?'w-m':'w-g'}">${PEOPLE[it.who][0]}</span>`}
            <span class="bk">${b.name}</span></div>`;
        }).join('')}</div>`;
    }).join('');
    return `<div class="gcard" data-g="${esc(g.t.toLowerCase())}">
      <div class="gt">${g.icon} ${esc(g.t)}</div>
      ${subs}</div>`;
  };
  document.getElementById('p2').innerHTML=`
    <input class="search" id="cs" placeholder="Что покупаете? Например: аптека, косметика, такси">
    <div class="legend">
      <span><b>М</b> / <b>Г</b> — чья карта</span>
      <span>Внутри группы сверху выгоднее. При равном % приоритет: Яндекс → Т-Банк → Альфа → ВТБ → Озон → Сбер</span>
    </div>
    <div class="cols" id="cbox">${
      DATA.groups.slice().sort((a,b)=>(a.last?1:0)-(b.last?1:0)).map(card).join('')}</div>`;
  document.getElementById('cs').oninput = e=>{
    const q=e.target.value.trim().toLowerCase();
    let vis=0;
    document.querySelectorAll('#p2 .gcard').forEach(g=>{
      let gv=0;
      g.querySelectorAll('.sub').forEach(s=>{
        let sv=0;
        s.querySelectorAll('.row').forEach(r=>{
          const hit=!q||r.dataset.n.includes(q)||s.dataset.t.includes(q)||g.dataset.g.includes(q);
          r.classList.toggle('hide',!hit); if(hit)sv++;
        });
        s.classList.toggle('hide',!sv); if(sv)gv++;
      });
      g.classList.toggle('hide',!gv); if(gv)vis++;
    });
    const old=document.querySelector('#p2 .empty'); if(old)old.remove();
    if(!vis) document.getElementById('cbox').insertAdjacentHTML('afterend',
      '<div class="empty">Ничего не нашлось. На всё — 1% у обоих: Яндекс, Т-Банк или Озон.</div>');
  };
}

/* ---------- вкладка 3: карты плашками ---------- */
function buildCards(){
  document.getElementById('p3').innerHTML = ['gleb','masha'].map(who=>
    `<div class="ksec"><h2>${PEOPLE[who]}</h2><div class="tiles">${BANKS.map(b=>{
      const lines = [...cardsOf(b.id,who).map(c=>`${c.d}${c.tag?`<small>${esc(c.tag)}</small>`:''}`),
                     ...extrasOf(b.id,who).map(e=>`${e.digits}<small>AA</small>`)];
      return `<div class="tile" style="background:${b.color};color:${b.text}">
        <div class="tn">${b.name}</div><div class="tnum">${lines.join('<br>')}</div></div>`;
    }).join('')}</div></div>`).join('');
}

document.querySelector('.tabs').onclick = e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));
  document.querySelectorAll('.pane').forEach(t=>t.classList.remove('act'));
  b.classList.add('act');
  document.getElementById('p'+b.dataset.i).classList.add('act');
};

buildGrid();buildCats();buildCards();
</script>
</body>
</html>
